 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Administrador de Menú UTP CRPO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --utp-purple: #6a0dad; }
    .header-bg { background: var(--utp-purple); }
    .eliminar-fila { background: #ffc107; color: black; border-radius: 50%; padding: 5px 10px; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body class="font-roboto bg-gray-100 text-gray-800" onunload="detachListener()">
  <header class="header-bg text-white py-4 text-center flex items-center justify-center shadow-md mb-8">
    <img src="logo_utp.png" alt="Logo UTP" class="h-12 mr-4">
    <h2 class="text-2xl font-bold">Administrador de Menú UTP CRPO</h2>
  </header>

  <div id="mainContent" class="hidden px-5 max-w-5xl mx-auto">
    <div class="overflow-x-auto">
        <table id="tablaMenu" class="w-full border-collapse my-5 shadow-lg bg-white rounded-lg overflow-hidden">
        <thead>
            <tr>
                <th class="p-4 border border-gray-200 text-left text-white uppercase font-bold text-sm" style="background-color: var(--utp-purple);">Descripción</th>
                <th class="p-4 border border-gray-200 text-left text-white uppercase font-bold text-sm" style="background-color: var(--utp-purple);">P. Estudiantil</th>
                <th class="p-4 border border-gray-200 text-left text-white uppercase font-bold text-sm" style="background-color: var(--utp-purple);">P. Administrativo</th>
                <th class="p-4 border border-gray-200 text-left text-white uppercase font-bold text-sm" style="background-color: var(--utp-purple);">Tiempo / Precarga</th>
                <th class="p-4 border border-gray-200 text-left text-white uppercase font-bold text-sm" style="background-color: var(--utp-purple);">Acción</th>
            </tr>
        </thead>
        <tbody></tbody>
        </table>
    </div>
    
    <div class="acciones text-center mt-8">
      <button class="agregar px-6 py-3 m-2 rounded-md font-bold bg-cyan-600 text-white hover:bg-cyan-700" onclick="agregarFila()">➕ Agregar Plato</button>
      <button class="guardar px-6 py-3 m-2 rounded-md font-bold bg-purple-700 text-white hover:bg-purple-800" onclick="guardar()">💾 Guardar Menú</button>
      <button class="borrar px-6 py-3 m-2 rounded-md font-bold bg-red-600 text-white hover:bg-red-700" onclick="borrarMenu()">🗑 Borrar Menú</button>
    </div>
  </div>

  <footer class="text-center text-xs text-gray-400 mt-4 mb-2">
    <p>&copy; <span id="year"></span> Derechos Reservados. Anthony Torres.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    let db, menuRef, listener;
    const tbody = document.querySelector("#tablaMenu tbody");

    async function initializeFirebase() {
        const response = await fetch('/api/firebase-config');
        const firebaseConfig = await response.json();
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        menuRef = db.collection("menus").doc("menuHoy");
        authenticate();
    }

    async function authenticate() {
      const password = prompt("Ingrese la contraseña:");
      if (!password) { window.location.href = "https://menu-utp-crpo.vercel.app/"; return; }
      const response = await fetch("./api/auth", {
        method: "POST",
        body: JSON.stringify({ password }),
        headers: { "Content-Type": "application/json" }
      });
      const data = await response.json();
      if (data.success) {
        document.getElementById('mainContent').classList.remove('hidden');
        loadMenu();
      } else {
        alert("Incorrecto");
        authenticate();
      }
    }
    
    function toggleProximo(checkbox) {
        const tiempoInput = checkbox.closest('td').querySelector('.tiempo-input');
        checkbox.checked ? tiempoInput.classList.remove('hidden') : tiempoInput.classList.add('hidden');
    }
    
    function agregarFila(desc = "", pEst = "", pAdm = "", tiempo = "", esProximo = false) {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td class="p-4 border border-gray-200"><input type="text" value="${desc}" class="w-full p-2 border rounded-md" onchange="capitalizeDescription(this)"></td>
        <td class="p-4 border border-gray-200"><input type="number" step="0.01" value="${pEst}" placeholder="0.00" class="w-full p-2 border rounded-md"></td>
        <td class="p-4 border border-gray-200"><input type="number" step="0.01" value="${pAdm}" placeholder="0.00" class="w-full p-2 border rounded-md"></td>
        <td class="p-4 border border-gray-200 text-center flex flex-col items-center">
            <input type="number" value="${tiempo}" class="tiempo-input w-24 p-2 border rounded-md ${esProximo ? '' : 'hidden'}">
            <div class="mt-2 text-sm font-bold"><input type="checkbox" ${esProximo ? 'checked' : ''} class="proximo-checkbox" onchange="toggleProximo(this)"> Próximo</div>
        </td>
        <td class="p-4 border border-gray-200 text-center"><button class="eliminar-fila" onclick="this.parentElement.parentElement.remove()">❌</button></td>
      `;
      tbody.appendChild(row);
    }

    async function guardar() {
      const items = [];
      tbody.querySelectorAll("tr").forEach(r => {
        const descripcion = r.cells[0].querySelector("input").value;
        const precioEst = r.cells[1].querySelector("input").value;
        const precioAdm = r.cells[2].querySelector("input").value;
        const tiempo = r.cells[3].querySelector(".tiempo-input").value;
        const esProximo = r.cells[3].querySelector(".proximo-checkbox").checked;

        if (descripcion && precioEst && precioAdm) {
            items.push({ 
                descripcion, 
                precioEst: parseFloat(precioEst).toFixed(2),
                precioAdm: parseFloat(precioAdm).toFixed(2),
                tiempo: parseInt(tiempo) || 0, 
                esProximo 
            });
        }
      });

      const hoy = new Date();
      const fecha = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`;
      
      const response = await fetch("./api/menu", {
        method: "POST",
        body: JSON.stringify({ fecha, items }),
        headers: { "Content-Type": "application/json" }
      });
      if ((await response.json()).success) alert("✅ Guardado");
    }

    function loadMenu() {
      listener = menuRef.onSnapshot(doc => {
        if (doc.exists && doc.data().items) {
          tbody.innerHTML = "";
          doc.data().items.forEach(item => {
            agregarFila(item.descripcion, item.precioEst || item.precio, item.precioAdm || "", item.tiempo || Math.round((item.readyAt - Date.now()) / (1000 * 60)), item.esProximo);
          });
        }
      });
    }

    function capitalizeDescription(input) {
      let v = input.value.trim().toLowerCase();
      if (v) input.value = v.charAt(0).toUpperCase() + v.slice(1);
    }

    initializeFirebase();
  </script>
</body>
</html>
